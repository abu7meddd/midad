<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مِداد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Cinzel:wght@500&family=Lalezar&family=Lemonada:wght@700&family=Changa:wght@800&family=Reem+Kufi:wght@700&family=Rubik:wght@300;400;500;600;800&display=swap">
<style>
/* Concept: a quiet dark cinema wall. Wide game screens in a stack, then a slow reel of stills at the bottom. The hero dissolves into the page instead of ending on a hard edge. */
:root{
  --bg:#0b0b0f; --surface:#14141b; --surface2:#1c1c26; --ink:#f4f1ea; --mute:#a9a6b8; --line:#2a2a37;
  --gold:#f3b53f; --gold-ink:#1b1305; --display:'Aref Ruqaa','Rubik',serif; --body:'Rubik','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl;scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto}
.bleed{margin-inline:calc(50% - 50vw);width:100vw}

nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0b0b0fee,#0b0b0fb0);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
nav.top .in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.logo b{font-family:var(--display);font-size:2rem;line-height:1;color:var(--gold)}
.logo span{font-size:.78rem;color:var(--mute);letter-spacing:.04em}
.pill{font:inherit;font-weight:600;font-size:.92rem;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.pill.ghost{background:#ffffff12;color:var(--ink);border:1px solid #ffffff22}

/* hero with moving rows */
.hero{position:relative;overflow:hidden;min-height:max(640px,calc(100svh - 56px));display:grid;align-items:center}
.rows{position:absolute;inset:-12% -8%;display:grid;align-content:center;gap:14px;direction:ltr;transform:rotate(-6deg);opacity:.85}
.row{display:flex;gap:14px;width:max-content;justify-self:start;direction:ltr;animation:slide 60s linear infinite}
.row:nth-child(even){animation-direction:reverse}
.row img{height:clamp(190px,27vh,290px);width:auto;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}
@keyframes slide{to{transform:translateX(-50%)}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 75% at 50% 48%,#0b0b0fc4 15%,#0b0b0f33 75%),linear-gradient(transparent 38%,#0b0b0f99 70%,var(--bg) 100%)}
.hero .copy{position:relative;z-index:2;text-align:center;padding-block:90px 120px;display:grid;gap:20px;justify-items:center}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,9vw,6rem);line-height:1.12;margin:0;text-wrap:balance;text-shadow:0 6px 40px #000}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{max-width:52ch;margin:0;color:#d6d3de;font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;align-items:center}
.cta .pill{padding:12px 30px;font-size:1rem}
.tea{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.45rem;color:#eadfc8;text-shadow:0 2px 18px #000}
.tea svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tea .steam{animation:steam 3s ease-in-out infinite;opacity:0}
.tea .steam:nth-of-type(2){animation-delay:1s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-5px)}}
.down{position:absolute;bottom:26px;left:50%;z-index:3;width:46px;height:46px;margin-left:-23px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff33;background:#0b0b0f88;backdrop-filter:blur(6px);animation:bob 2.2s ease-in-out infinite}
.down svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;margin-top:10px}
.stat{background:#14141bcc;border:1px solid var(--line);border-radius:14px;padding:10px 22px;min-width:120px;backdrop-filter:blur(6px)}
.stat strong{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--mute)}

h2.sec{font-family:var(--display);font-size:clamp(1.9rem,4.5vw,2.8rem);margin:0 0 6px}
p.sub{color:#c9c6d6;margin:0 0 26px;text-shadow:0 2px 14px #000,0 0 3px #000}
h2.sec{text-shadow:0 3px 22px #000}

/* mural: huge faint calligraphy that fills the page behind the cards */
body{position:relative}
/* sky: one light canvas behind the page (stars, embers, nebula, a distant black hole) */
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;display:block}

/* each game's title is set in the style of its own studio logo */
.logo-h{margin:0;font-weight:400;line-height:1;padding-bottom:.45em}
.lg{display:inline-block;line-height:1.05}
.lg-st{display:inline-grid;justify-items:center;line-height:1;padding-bottom:.1em;font-family:'Lalezar',serif;font-size:clamp(2.7rem,6.6vw,4.8rem);color:#fbefd8;-webkit-text-stroke:.075em #2c1a1f;paint-order:stroke fill;transform:skewX(-7deg) rotate(-1.5deg);
  text-shadow:.03em .05em 0 #b06a73,.06em .1em 0 #2c1a1f,0 .25em .5em #0009}
.lg-st .l1{font-size:.62em;letter-spacing:.04em}
.lg-pbz .a{display:block;padding-bottom:.2em;font-family:'Amiri',serif;font-weight:400;font-size:clamp(2.5rem,6.2vw,4.4rem);color:#f2ece1;text-shadow:0 3px 24px #000b}
.lg-pbz .e{display:block;font-family:'Cinzel',serif;font-size:clamp(.68rem,1.2vw,.95rem);letter-spacing:.38em;color:#e6dfd0;margin-top:.7em;direction:ltr;text-align:right;text-shadow:0 2px 12px #000}
.lg-pbz .slash{display:inline-block;width:.06em;height:.95em;margin-inline:.35em;vertical-align:middle;background:linear-gradient(#e6b45a,#a8341f);transform:rotate(24deg)}
.lg-ml{display:inline-grid;justify-items:center;gap:.05em;font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:clamp(2.4rem,6vw,4.3rem);line-height:1.12;padding-bottom:.12em;color:#fff;text-shadow:0 3px 22px #0008}
.lg-ml .rule{position:relative;display:block;width:100%;height:14px;margin:.12em 0}
.lg-ml .rule b{position:absolute;top:50%;left:8px;right:8px;height:2px;background:#fff;transform:translateY(-50%)}
.lg-ml .rule::before,.lg-ml .rule::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:6px solid transparent}
.lg-ml .rule::before{left:-2px;border-left:0;border-right-color:#fff}
.lg-ml .rule::after{right:-2px;border-right:0;border-left-color:#fff}
.lg-t2c{display:inline-grid;justify-items:center;gap:.05em}
.lg-t2c .t{font-family:'Lemonada',cursive;font-weight:700;font-size:clamp(2rem,5.2vw,3.7rem);line-height:1.2;color:#fff;text-shadow:0 3px 0 #7fb2dd,0 12px 26px #0007}
.lg-t2c .sky{width:clamp(110px,15vw,170px);height:auto}
.lg-t2c .swash{width:62%;height:auto}
.lg-ps .stamp{display:inline-grid;place-items:center;padding:.6em .95em;aspect-ratio:1;border-radius:50%;border:.1em solid #f2c230;outline:.05em solid #f2c230;outline-offset:.2em;transform:rotate(-14deg);
  font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1.5rem,3.7vw,2.7rem);line-height:.95;color:#f2c230;text-align:center;filter:url(#stampf)}
.lg-ps .stamp span{display:block;transform:skewX(-8deg)}/* wide game screens */
.screens{display:grid;gap:clamp(34px,6vw,72px);padding-block:20px 20px}
.screen{position:relative;display:grid;align-items:end;min-height:420px;border-radius:22px;overflow:hidden;text-decoration:none;border:1px solid var(--line);isolation:isolate;background:var(--surface)}
.slides{position:absolute;inset:-9% 0;z-index:-2;will-change:transform}
.s{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:none}
.s.on{opacity:1;transform:scale(1);transition:opacity 1.3s ease,transform 9s linear}
.s.out{opacity:0;transform:scale(1);transition:opacity 1.3s ease}
.screen::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#0b0b0fd0 0%,#0b0b0f55 30%,transparent 58%),linear-gradient(270deg,#0b0b0fb8 0%,#0b0b0f66 28%,transparent 54%)}
.screen{box-shadow:0 38px 90px -40px var(--glow,#000);transform:translateY(40px);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.screen.in{transform:none}
.screen h3,.screen .blurb{text-shadow:0 2px 18px #000b}
.screen .info{padding:28px;display:grid;gap:8px;max-width:640px;justify-self:start}
.screen h3{margin:0}
.screen .en{margin-top:.25em;direction:ltr;text-align:right;font-size:.9rem;color:#d0cddb;letter-spacing:.06em;text-transform:uppercase}
.screen .blurb{margin:0;color:#e4e1ec;max-width:56ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.84rem;color:#cfcbdb}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tag{font-size:.78rem;background:#ffffff16;border:1px solid #ffffff22;padding:2px 12px;border-radius:99px;backdrop-filter:blur(4px)}
.tag.gold{background:#f3b53f22;border-color:#f3b53f66;color:var(--gold)}
.screen.big{min-height:560px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}

/* reel */
.reelwrap{padding-block:60px 0}
.reel{position:relative;aspect-ratio:21/9;min-height:300px;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);isolation:isolate}
.reel .r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:none}
.reel .r.on{opacity:1;transform:scale(1);transition:opacity 1s ease,transform 6.5s linear}
.reel .r.out{opacity:0;transform:scale(1);transition:opacity 1s ease}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b0b0fe6 0%,transparent 45%);pointer-events:none}
.rcap{position:absolute;z-index:2;inset-inline-start:22px;bottom:20px;display:flex;align-items:baseline;gap:12px;text-decoration:none}
.rcap b{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.4rem);font-weight:700;line-height:1.2;text-shadow:0 2px 20px #000}
.rcap small{color:var(--gold);font-size:.85rem}
.rprog{position:absolute;z-index:2;inset:auto 0 0 0;height:3px;background:#ffffff14}
.rprog i{display:block;height:100%;background:var(--gold);transform-origin:right;transform:scaleX(0)}
.rprog i.go{animation:prog 4.6s linear both}
@keyframes prog{to{transform:scaleX(1)}}

.req{margin-top:60px;border:1px solid #f3b53f44;border-radius:22px;padding:34px;background:linear-gradient(135deg,#f3b53f1c,transparent 60%);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.req h3{font-family:var(--display);font-size:2rem;margin:0}
.req p{margin:0;color:var(--mute)}

/* constellation of games + counters */
.const{padding-block:80px 10px}
.cwrap{position:relative;border:1px solid var(--line);border-radius:22px;background:linear-gradient(#0d0d13cc,#0a0a0fcc);overflow:hidden;padding:10px}
.csvg{display:block;width:100%;height:auto}
.cl{stroke:#f3b53f;stroke-width:1.1;stroke-opacity:.55;fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease}
.const.in .cl{stroke-dashoffset:0}
.cs{outline:none;cursor:pointer;opacity:0;transition:opacity .7s ease}
.const.in .cs{opacity:1;transition-delay:var(--d,0s)}
.cs .sg{transform-box:fill-box;transform-origin:center;transform:scale(var(--sc,1));transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cs:hover .sg,.cs:focus-visible .sg{transform:scale(calc(var(--sc,1)*1.55))}
.cs .sp{fill:#f3b53f}
.cs .co{fill:#fff}
.cs .rg{fill:none;stroke:#f3b53f;stroke-width:1;stroke-opacity:.35;transition:stroke-opacity .3s,r .35s}
.cs:hover .rg,.cs:focus-visible .rg{stroke-opacity:.9;r:30}
.cs text{font-family:var(--display);font-size:25px;fill:#f4ecd8;text-anchor:middle;paint-order:stroke;stroke:#0b0b0f;stroke-width:5px;transition:fill .3s}
.cs:hover text,.cs:focus-visible text{fill:#f3b53f}
.cs text.by{font-family:var(--body);font-size:14px;fill:#a9a6b8;stroke-width:3px}
.tw{animation:tw 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
.clist{display:none;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px 6px 14px}
.clist a{font-family:var(--display);font-size:1.05rem;padding:4px 14px;border:1px solid #f3b53f66;border-radius:99px;text-decoration:none;color:#f4ecd8}
.stats2{padding-block:64px 6px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.num{border-top:1px solid #f3b53f66;padding:16px 4px 4px}
.num strong{display:block;font-size:clamp(2.4rem,5vw,3.6rem);font-weight:800;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num span{color:#cfcbdc;font-size:.95rem}
.nnote{color:var(--mute);font-size:.82rem;margin:18px 0 0}
@media (max-width:760px){.csvg text{display:none}.clist{display:flex}.cwrap{padding-bottom:0}.cs .sg{transform:scale(calc(var(--sc,1)*2.6))}.cs:hover .sg{transform:scale(calc(var(--sc,1)*3))}.cs .rg{display:none}.cl{stroke-width:2.2}}
/* latest updates (written) + poem of the day */
.upd{padding-block:76px 6px}
.upd-hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:34px}
.hl{position:relative;display:grid;align-content:end;min-height:220px;border-radius:22px;overflow:hidden;text-decoration:none;border:1px solid var(--line);isolation:isolate;padding:24px;background:var(--surface);transition:transform .3s ease,border-color .3s ease}
.hl:hover{transform:translateY(-4px);border-color:#f3b53f88}
.hl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.6}
.hl::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#0b0b0fee 6%,#0b0b0f88 55%,#0b0b0f40)}
.hl .k{color:var(--gold);letter-spacing:.06em;font-size:.82rem;font-weight:600}
.hl h3{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.1rem);margin:2px 0 4px;line-height:1.25}
.hl p{margin:0 0 6px;color:#dcd9e6;font-size:.92rem}
.hl time{color:#a9a6b8;font-size:.8rem}
.log{list-style:none;margin:0;padding:0;position:relative}
.log::before{content:"";position:absolute;inset-block:10px;inset-inline-start:6px;width:1px;background:linear-gradient(var(--gold),#f3b53f10)}
.log li{position:relative;padding:11px 0;padding-inline-start:36px;display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:baseline}
.log li::before{content:"";position:absolute;inset-inline-start:1px;top:21px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.log li.up::before{background:var(--gold)}
.log time{color:var(--mute);font-size:.82rem;white-space:nowrap}
.log b{font-weight:600}.log .t{color:var(--gold);font-size:.78rem;margin-inline-end:8px}
.log span.n{color:#bdb9cc;font-size:.9rem;grid-column:2}
.poem{padding-block:84px 24px;text-align:center}
.poem .pk{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px;color:var(--gold);letter-spacing:.3em;font-size:.8rem}
.poem .pk i{flex:1;max-width:240px;height:1px;background:linear-gradient(90deg,transparent,#f3b53f99)}
.poem .pk i:last-child{transform:scaleX(-1)}
.pq{min-height:clamp(170px,24vw,250px);display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:.05em .42em;margin:22px auto 0;max-width:min(900px,92%);font-family:'Amiri',serif;font-weight:700;font-size:clamp(1.8rem,4.6vw,3.3rem);line-height:1.75;color:#f4ecd8;text-wrap:balance}
.pq .w{display:inline-block;opacity:0;transform:translateY(14px);animation:wIn .9s cubic-bezier(.2,.7,.2,1) forwards}
.pq.out .w{animation:wOut .7s ease forwards}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes wOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}
.pa{margin-top:8px;color:var(--gold);font-size:.95rem;opacity:0;transition:opacity .8s ease}
.pdots{display:flex;gap:8px;justify-content:center;margin-top:22px}
.pdots i{width:6px;height:6px;border-radius:50%;background:#ffffff26;transition:background .4s,transform .4s}
.pdots i.on{background:var(--gold);transform:scale(1.35)}
@media (max-width:760px){.upd-hl{grid-template-columns:1fr}.hl{min-height:190px}.pq{max-width:18ch}}
/* before / after: English screenshot vs the same screen with the real Arabic strings from the localization file */
.ba{margin-block:34px 6px}
.ba h2{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0 0 4px}
.ba .bsub{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.bagrid{display:grid;gap:26px}
.bacard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;--p:50%;touch-action:pan-y;cursor:ew-resize;direction:ltr;background:#000;outline-offset:3px}
.bacard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.bacard .ar{clip-path:inset(0 0 0 var(--p))}
.bacard .h{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--gold);transform:translateX(-1px);pointer-events:none}
.bacard .h::after{content:"";position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#0b0b0fdd;border:2px solid var(--gold)}
.bacard .h::before{content:"\2194";position:absolute;top:50%;left:50%;z-index:1;transform:translate(-50%,-52%);color:var(--gold);font-size:20px;line-height:1}
.bacard .chip{position:absolute;top:12px;z-index:2;font-size:.78rem;padding:2px 12px;border-radius:99px;background:#000b;border:1px solid #ffffff33;color:#fff;pointer-events:none}
.bacard .chip.l{left:12px}.bacard .chip.r{right:12px;color:var(--gold);border-color:#f3b53f88}
.bacap{color:var(--mute);font-size:.86rem;margin:8px 0 0}
.bacap b{color:#d8d5e2;font-weight:600}
/* detail */
.dhero{position:relative;min-height:520px;display:grid;align-items:end;overflow:hidden;isolation:isolate}
.dhero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.dhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 4%,#0b0b0f88 55%,#0b0b0f44),linear-gradient(270deg,#0b0b0fcc,transparent 60%)}
.dhero .in{max-width:1180px;width:100%;margin-inline:auto;padding-block:90px 34px}
.dhero h1{margin:0 0 8px}
.dhero .en{direction:ltr;text-align:right;color:#d0cddb;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;margin-bottom:12px}
.dhero p{max-width:62ch;margin:0 0 18px;color:#e4e1ec}
.back{display:inline-block;margin-block:16px 0;color:var(--mute);text-decoration:none;font-size:.95rem}
.back:hover{color:var(--gold)}
.dl{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.dl .pill{padding:14px 38px;font-size:1.05rem}
.dl .pill[aria-disabled="true"]{background:var(--surface2);color:var(--mute);cursor:not-allowed}
.dl small{color:var(--mute)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-block:10px 8px}
.shots button{padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:none;cursor:zoom-in;display:block}
.shots img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform .5s}
.shots button:hover img{transform:scale(1.05)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-block:30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.panel h2{margin:0 0 14px;font-size:1rem;font-weight:600;color:var(--gold)}
.panel dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px}
.panel dt{color:var(--mute);font-size:.9rem}.panel dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.panel ul,.panel ol{margin:0;padding-inline-start:20px;display:grid;gap:7px}
.lb{position:fixed;inset:0;z-index:60;background:#000e;display:grid;place-items:center;padding:20px}
.lb img{max-width:100%;max-height:88vh;border-radius:12px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;font:inherit;background:#ffffff22;color:#fff;border:0;border-radius:99px;padding:6px 18px;cursor:pointer}
footer{margin-top:80px;padding-block:28px 40px;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (max-width:760px){
  .pair{grid-template-columns:1fr}
  .screen,.screen.big{min-height:460px}
  .screen .info{padding:20px}
  .reel{aspect-ratio:16/10}
  .dhero .in{padding-block:70px 26px}
  .hero{min-height:max(580px,calc(100svh - 56px))}.hero .copy{padding-block:70px 100px}
  .row img{height:clamp(130px,19vh,190px)}
}
@media (prefers-reduced-motion:reduce){.screen .bg,.tea .steam{animation:none;transition:none}}

  var inMs=words.length*170+900;
  pTimer=setTimeout(function(){pa.style.transition='opacity .8s ease';pa.style.opacity=1;
    pTimer=setTimeout(function(){el.classList.add('out');pa.style.opacity=0;pTimer=setTimeout(showQuote,800)},3600)},inMs);
}
function initPoem(){
  var s=document.querySelector('.poem');if(!s)return;
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){if(!pTimer)showQuote()}else{clearTimeout(pTimer);pTimer=null}})},{threshold:.3}).observe(s)}else showQuote();
}/* كوكبة مِداد: كل لعبة نجمة، تتصل بخط رفيع، وتزيد نجمة مع كل تعريب جديد */
var CPOS=[[190,250],[400,105],[620,240],[820,100]];
function cpos(i){if(i<CPOS.length)return CPOS[i];var k=i-CPOS.length;return [100+((k*173)%800),70+((k*97)%240)]}
function constHTML(){
  var G=GAMES.filter(function(g){return !g.guest}),P=G.map(function(g,i){return cpos(i)});
  var lines=P.slice(1).map(function(p,i){var a=P[i];return '<path class="cl" pathLength="1" d="M'+a[0]+' '+a[1]+'L'+p[0]+' '+p[1]+'"/>'}).join('');
  var stars=G.map(function(g,i){var p=P[i],cnt=LOG.filter(function(e){return e.id===g.id}).length,sc=(1+Math.min(.9,(cnt-1)*.25)).toFixed(2);return '<a class="cs" href="#'+g.id+'" style="--d:'+(0.5+i*.35).toFixed(2)+'s" aria-label="'+esc(g.ar)+'"><g transform="translate('+p[0]+' '+p[1]+')"><g class="tw" style="--d:'+(i*.7)+'s"><circle class="rg" r="20"/><g class="sg" style="--sc:'+sc+'"><path class="sp" d="M0-15L3.4-3.4L15 0L3.4 3.4L0 15L-3.4 3.4L-15 0L-3.4-3.4Z"/><circle class="co" r="3.4"/></g></g><text y="46">'+esc(g.ar)+'</text><text class="by" y="66">'+esc(g.by.replace(/^ترجمة /,'').split(' · ')[0])+'</text></g></a>'}).join('');
  var chips=G.map(function(g){return '<a href="#'+g.id+'">'+esc(g.ar)+'</a>'}).join('');
  return '<section class="const" id="const"><h2 class="sec">كوكبة مِداد</h2><p class="sub">كل لعبة عرّبناها نجمة في السماء. اقترب منها واضغط لتفتحها.</p><div class="cwrap"><svg class="csvg" viewBox="0 0 1000 340" role="group" aria-label="كوكبة الألعاب">'+lines+stars+'</svg><div class="clist">'+chips+'</div></div></section>';
}
/* أرقام حقيقية: الأسطر محسوبة من ملفات برج السيادة (15375 ink + 2376 csv) ونصل الطيف (10416 نصاً في locres) فقط */
var TEAM=['أبو حميد','أبو النوفي'],SINCE='2026-11-03',LINES=17751;
function statsHTML(){
  var days=Math.max(1,Math.floor((Date.now()-new Date(SINCE+'T00:00:00'))/864e5)+1);
  function n(v,l){return '<div class="num"><strong data-to="'+v+'">0</strong><span>'+l+'</span></div>'}
  return '<section class="stats2" id="nums"><h2 class="sec">كم عرّبنا</h2><p class="sub">أرقام من ملفات الترجمة نفسها.</p><div class="nums">'+n(GAMES.filter(function(g){return !g.guest}).length,'لعبة معرّبة')+n(TEAM.length,'معرّبين')+n(LINES,'سطر معرّب')+n(days,'يوم منذ أول تعريب')+'</div><p class="nnote">الأسطر معدودة من برج السيادة فقط، وتُضاف بقية الألعاب عند حصرها.</p></section>';
}
function initConstNums(){
  if(!('IntersectionObserver' in window)){var c=document.getElementById('const');if(c)c.classList.add('in');document.querySelectorAll('.num strong').forEach(function(e){e.textContent=(+e.dataset.to).toLocaleString('ar-EG')});return}
  var co=document.getElementById('const'),no=document.getElementById('nums');
  if(co)new IntersectionObserver(function(es,ob){es.forEach(function(e){if(e.isIntersecting){co.classList.add('in');ob.disconnect()}})},{threshold:.25}).observe(co);
  if(no)new IntersectionObserver(function(es,ob){es.forEach(function(e){if(e.isIntersecting){ob.disconnect();no.querySelectorAll('.num strong').forEach(function(el){var to=+el.dataset.to,t0=performance.now(),dur=1500;(function step(now){var p=Math.min(1,(now-t0)/dur),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=v.toLocaleString('ar-EG');if(p<1)requestAnimationFrame(step)})(t0)})}})},{threshold:.4}).observe(no);
}function baHTML(g){
  if(!g.ba||!g.ba.length)return '';
  return '<section class="ba"><h2>قبل وبعد</h2><p class="bsub">حرّك المقبض: يسار الإنجليزي الأصلي ويمين التعريب.</p><div class="bagrid">'+g.ba.map(function(b){
    return '<figure style="margin:0"><div class="bacard" tabindex="0" role="slider" aria-label="مقارنة الإنجليزي بالعربي" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><img src="'+b.en+'" alt="النص الإنجليزي" draggable="false"><img class="ar" src="'+b.ar+'" alt="النص العربي" draggable="false"><span class="chip l">English</span><span class="chip r">عربي</span><i class="h"></i></div>'+
    '<figcaption class="bacap"><b>معاينة تركيب:</b> النص العربي مأخوذ حرفياً من ملف تعريب '+esc(g.ar)+' ('+esc(b.ref)+') ومركّب على اللقطة الأصلية، فقد يختلف الإطار والتفاف الأسطر شيئاً يسيراً عمّا يظهر داخل اللعبة. '+(b.note?esc(b.note):'')+'</figcaption></figure>'}).join('')+'</div></section>';
}
function initBA(){
  document.querySelectorAll('.bacard').forEach(function(c){
    function set(p){p=Math.max(0,Math.min(100,p));c.style.setProperty('--p',p+'%');c.setAttribute('aria-valuenow',Math.round(p))}
    function fromX(x){var r=c.getBoundingClientRect();set((x-r.left)/r.width*100)}
    var down=false;
    c.addEventListener('pointerdown',function(e){down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}fromX(e.clientX)});
    c.addEventListener('pointermove',function(e){if(down)fromX(e.clientX)});
    c.addEventListener('pointerup',function(){down=false});c.addEventListener('pointercancel',function(){down=false});
    c.addEventListener('keydown',function(e){var p=parseFloat(getComputedStyle(c).getPropertyValue('--p'))||50;if(e.key==='ArrowLeft'){set(p-5);e.preventDefault()}else if(e.key==='ArrowRight'){set(p+5);e.preventDefault()}});
  });
}function screen(g,cls){
  return '<a class="screen '+(cls||'')+'" href="#'+g.id+'" style="--glow:'+(g.glow||'#000')+'"><div class="slides"><img class="s" alt=""><img class="s" alt=""></div>'+
   '<div class="info"><h3 class="logo-h">'+logoHTML(g)+'</h3>'+(g.lg==='pbz'?'':'<span class="en">'+esc(g.en)+'</span>')+'<p class="blurb">'+esc(g.blurb)+'</p>'+
   '<div class="meta"><span>'+esc(g.size)+'</span><span>'+esc(g.kind)+'</span><span style="direction:ltr">'+esc(g.date)+'</span></div>'+tagsOf(g)+'</div></a>';
}
/* أول لعبتين عريضتين كبار، والباقي أزواج، وإن بقيت لعبة وحدها تأخذ العرض كامل */
function screensHTML(){return GAMES.map(function(g){return screen(g,'big')}).join('')}
/* الشريط المتغيّر: لقطات كل الألعاب بالتناوب بين الألعاب بدون تكرار متتالي */
function reelPool(){
  var p=[];[1,2,3].forEach(function(n){GAMES.forEach(function(g){p.push({g:g,src:img(g,'shot'+n)})})});return p;
}
function reelShow(pool){
  var it=pool[rIdx%pool.length];rIdx++;
  var box=document.getElementById('reel');if(!box)return stopTimer();
  var imgs=box.querySelectorAll('.r'),next=(rCur===imgs[0])?imgs[1]:imgs[0],prev=rCur;
  var cap=document.getElementById('rcap');cap.href='#'+it.g.id;cap.innerHTML='<b>'+esc(it.g.ar)+'</b><small>افتح الصفحة</small>';
  next.onload=function(){
    if(prev){prev.className='r out';setTimeout(function(){if(prev!==rCur)prev.className='r'},1200)}
    next.className='r';void next.offsetWidth;
    if(!prev){next.style.transition='transform 6.5s linear';next.className='r on';setTimeout(function(){next.style.transition=''},80)}
    else next.className='r on';
    rCur=next;
    var bar=document.getElementById('rbar');bar.className='';void bar.offsetWidth;bar.className='go';
  };
  next.src=it.src;
}
function home(){
  stopTimer();rIdx=0;rCur=null;
  var all=[];['shot1','shot2','shot3','hero'].forEach(function(k){GAMES.forEach(function(g){all.push(img(g,k))})});
  /* كل ما زادت التعريبات زادت الصفوف وتنوعت الصور تلقائياً */
  var nRows=Math.min(7,3+Math.ceil(GAMES.length/3)),per=Math.min(all.length,12);
  var rows=Array.apply(null,Array(nRows)).map(function(_,r){
    var start=Math.floor(all.length/nRows)*r,rot=[];
    for(var i=0;i<per;i++)rot.push(all[(start+i)%all.length]);
    var one=rot.map(function(s){return '<img src="'+s+'" alt="">'}).join('');
    return '<div class="row" style="animation-duration:'+(per*5)+'s">'+one+one+'</div>';
  }).join('');
  var last=GAMES.map(function(g){return g.date}).sort().pop();
  var cup='<svg viewBox="0 0 32 32" aria-hidden="true"><path class="steam" d="M11 9c-1.5-1.6 1.5-2.6 0-4.4"/><path class="steam" d="M17 9c-1.5-1.6 1.5-2.6 0-4.4"/><path d="M5 14h18v5a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z"/><path d="M23 15h2.2a3 3 0 0 1 0 6H22.5"/></svg>';
  app.innerHTML=
   '<section class="hero bleed"><div class="rows" aria-hidden="true">'+rows+'</div>'+
   '<div class="copy wrap">'+
   '<h1>ألعابك <em>انكتبت</em><br>بحبر عربي</h1>'+
   '<p>تعريبات صنعناها بأيدينا لألعاب نحبها، نصوص وواجهات وخطوط على ذوقنا.</p>'+
   '<div class="cta"><a class="pill" href="#all">تصفّح التعريبات</a><span class="tea">'+cup+'صبّ لك شاهي، واختر تعريبك</span></div>'+
   '<div class="stats"><div class="stat"><strong>'+GAMES.filter(function(g){return !g.guest}).length+'</strong><span>لعبة معرّبة</span></div><div class="stat"><strong style="direction:ltr">'+last+'</strong><span>آخر تحديث</span></div></div>'+
   '</div><a class="down" href="#all" aria-label="انزل لتشوف التعريبات"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></a></section>'+
   '<div class="wrap"><div class="screens" id="all" style="scroll-margin-top:80px"><div class="hd"><h2 class="sec">كل التعريبات</h2><p class="sub">اضغط على أي لعبة لتفتح صفحتها وتحمّل التعريب.</p></div>'+screensHTML()+'</div>'+
   '<section class="reelwrap hd"><h2 class="sec">من داخل عوالمنا</h2><p class="sub">لقطات تتبدّل من الألعاب اللي عرّبناها.</p>'+
   '<div class="reel" id="reel"><img class="r" alt=""><img class="r" alt=""><a class="rcap" id="rcap" href="#"></a><div class="rprog"><i id="rbar"></i></div></div></section>'+
   constHTML()+statsHTML()+updatesHTML()+poemHTML()+'<section class="req" id="request"><div><h3>ما لقيت لعبتك؟</h3><p>اكتب لنا اسم اللعبة اللي تبي تشوفها بالعربي.</p></div><span class="pill ghost">الطلبات تفتح قريباً</span></section></div>';
  var pool=reelPool();reelShow(pool);initCards();initPoem();initConstNums();
  timer=setInterval(function(){reelShow(pool)},4600);
}
function detail(g){
  stopTimer();
  var shots=[1,2,3].map(function(n){return '<button data-src="'+img(g,'shot'+n)+'" aria-label="تكبير الصورة"><img src="'+img(g,'shot'+n)+'" alt="" loading="lazy"></button>'}).join('');
  var btn=g.dl?'<a class="pill" href="'+esc(g.dl)+'" target="_blank" rel="noopener">حمّل التعريب</a>':'<span class="pill" aria-disabled="true">التحميل قريباً</span>';
  app.innerHTML=
   '<section class="dhero bleed"><img class="bg" src="'+img(g,'hero')+'" alt="" onerror="this.src=\''+img(g,'shot1')+'\'"><div class="in">'+
   '<a class="back" href="#">&rarr; كل التعريبات</a><h1 class="logo-h">'+logoHTML(g)+'</h1>'+(g.lg==='pbz'?'':'<div class="en">'+esc(g.en)+'</div>')+'<p>'+esc(g.blurb)+'</p>'+tagsOf(g)+
   '<div class="dl" style="margin-top:18px">'+btn+'<small>'+esc(g.kind)+' · '+esc(g.size)+'</small></div></div></section>'+
   '<div class="wrap"><div class="shots">'+shots+'</div>'+baHTML(g)+'<div class="panels">'+
   '<section class="panel"><h2>بيانات التعريب</h2><dl><dt>العمل</dt><dd>'+esc(g.by)+'</dd><dt>المطوّر</dt><dd style="direction:ltr;text-align:right">'+esc(g.dev)+'</dd><dt>المحرك</dt><dd>'+esc(g.engine)+'</dd><dt>الصيغة</dt><dd>'+esc(g.kind)+'</dd><dt>الحجم</dt><dd>'+esc(g.size)+'</dd><dt>آخر تحديث</dt><dd style="direction:ltr;text-align:right">'+esc(g.date)+'</dd></dl></section>'+
   '<section class="panel"><h2>ما يشمله</h2><ul>'+g.feats.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>'+
   '<section class="panel"><h2>طريقة التثبيت</h2><ol>'+g.how.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></section></div></div>';
  initBA();app.querySelectorAll('.shots button').forEach(function(b){b.onclick=function(){lb.innerHTML='<button>إغلاق</button><img src="'+b.dataset.src+'" alt="">';lb.hidden=false}});
}
lb.onclick=function(){lb.hidden=true};
document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.hidden=true});
function route(){
  var id=location.hash.replace('#','');
  var g=GAMES.filter(function(x){return x.id===id})[0];
  if(g){detail(g);document.title=g.ar+' | مِداد';window.scrollTo(0,0)}
  else{home();document.title='مِداد';if(id==='all'||id==='request'){var el=document.getElementById(id);if(el)el.scrollIntoView()}else window.scrollTo(0,0)}
}
window.addEventListener('hashchange',function(){route();setTimeout(buildMural,500)});window.addEventListener('resize',function(){clearTimeout(window._mr);window._mr=setTimeout(buildMural,300)});route();setTimeout(buildMural,600);setTimeout(buildMural,2500);
</script>
