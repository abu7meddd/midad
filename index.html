<style>
/* Concept: a quiet dark cinema wall. Wide game screens in a stack, then a slow reel of stills at the bottom. The hero dissolves into the page instead of ending on a hard edge. */
:root{
  --bg:#0a0b0d; --surface:#111114; --surface2:#1c1c26; --ink:#f4f1ea; --mute:#a9a6b8; --line:#2a2a37;
  --gold:#f3b53f; --gold-ink:#1b1305; --display:'Aref Ruqaa','Rubik',serif; --body:'Rubik','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl;scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto}
.bleed{margin-inline:calc(50% - 50vw);width:100vw}

nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0a0b0dee,#0a0b0db0);backdrop-filter:blur(10px);border-bottom:1px solid #ffffff10}
nav.top .in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.logo b{font-family:var(--display);font-size:2rem;line-height:1;color:var(--gold)}
.logo span{font-size:.78rem;color:var(--mute);letter-spacing:.04em}
.pill{font:inherit;font-weight:600;font-size:.92rem;background:var(--gold);color:var(--gold-ink);border:0;border-radius:99px;padding:8px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.pill.ghost{background:#ffffff12;color:var(--ink);border:1px solid #ffffff22}

/* hero with moving rows */
.hero{position:relative;overflow:hidden;min-height:max(640px,calc(100svh - 56px));display:grid;align-items:center}
.rows{position:absolute;inset:-12% -8%;display:grid;align-content:center;gap:14px;direction:ltr;transform:rotate(-6deg);opacity:.85}
.row{display:flex;gap:14px;width:max-content;justify-self:start;direction:ltr;animation:slide 60s linear infinite}
.row:nth-child(even){animation-direction:reverse}
.row img{height:clamp(190px,27vh,290px);width:auto;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}
@keyframes slide{to{transform:translateX(-50%)}}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 75% at 50% 48%,#0a0b0dc4 15%,#0a0b0d33 75%),linear-gradient(transparent 38%,#0a0b0d99 70%,var(--bg) 100%)}
.hero .copy{position:relative;z-index:2;text-align:center;padding-block:90px 120px;display:grid;gap:20px;justify-items:center}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,9vw,6rem);line-height:1.12;margin:0;text-wrap:balance;text-shadow:0 6px 40px #000}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{max-width:52ch;margin:0;color:#d6d3de;font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;align-items:center}
.cta .pill{padding:12px 30px;font-size:1rem}
.tea{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.45rem;color:#eadfc8;text-shadow:0 2px 18px #000}
.tea svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tea .steam{animation:steam 3s ease-in-out infinite;opacity:0}
.tea .steam:nth-of-type(2){animation-delay:1s}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-5px)}}
.down{position:absolute;bottom:26px;left:50%;z-index:3;width:46px;height:46px;margin-left:-23px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff33;background:#0a0b0d88;backdrop-filter:blur(6px);animation:bob 2.2s ease-in-out infinite}
.down svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;margin-top:10px}
.stat{background:#14141bcc;border:1px solid var(--line);border-radius:14px;padding:10px 22px;min-width:120px;backdrop-filter:blur(6px)}
.stat strong{display:block;font-size:1.7rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--mute)}

h2.sec{font-family:var(--display);font-size:clamp(1.9rem,4.5vw,2.8rem);margin:0 0 6px}
p.sub{color:#c9c6d6;margin:0 0 26px;text-shadow:0 2px 14px #000,0 0 3px #000}
h2.sec{text-shadow:0 3px 22px #000}

/* mural: huge faint calligraphy that fills the page behind the cards */
body{position:relative}
/* sky: one light canvas behind the page (stars, embers, nebula, a distant black hole) */
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;display:block}

/* each game's title is set in the style of its own studio logo */
.logo-h{margin:0;font-weight:400;line-height:1;padding-bottom:.45em}
.lg{display:inline-block;line-height:1.05}
.lg-st{display:inline-grid;justify-items:center;line-height:1;padding-bottom:.1em;font-family:'Lalezar',serif;font-size:clamp(2.7rem,6.6vw,4.8rem);color:#fbefd8;-webkit-text-stroke:.075em #2c1a1f;paint-order:stroke fill;transform:skewX(-7deg) rotate(-1.5deg);
  text-shadow:.03em .05em 0 #b06a73,.06em .1em 0 #2c1a1f,0 .25em .5em #0009}
.lg-st .l1{font-size:.62em;letter-spacing:.04em}
.lg-pbz .a{display:block;padding-bottom:.2em;font-family:'Amiri',serif;font-weight:400;font-size:clamp(2.5rem,6.2vw,4.4rem);color:#f2ece1;text-shadow:0 3px 24px #000b}
.lg-pbz .e{display:block;font-family:'Cinzel',serif;font-size:clamp(.68rem,1.2vw,.95rem);letter-spacing:.38em;color:#e6dfd0;margin-top:.7em;direction:ltr;text-align:right;text-shadow:0 2px 12px #000}
.lg-pbz .slash{display:inline-block;width:.06em;height:.95em;margin-inline:.35em;vertical-align:middle;background:linear-gradient(#e6b45a,#a8341f);transform:rotate(24deg)}
.lg-ml{display:inline-grid;justify-items:center;gap:.05em;font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:clamp(2.4rem,6vw,4.3rem);line-height:1.12;padding-bottom:.12em;color:#fff;text-shadow:0 3px 22px #0008}
.lg-ml .rule{position:relative;display:block;width:100%;height:14px;margin:.12em 0}
.lg-ml .rule b{position:absolute;top:50%;left:8px;right:8px;height:2px;background:#fff;transform:translateY(-50%)}
.lg-ml .rule::before,.lg-ml .rule::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:6px solid transparent}
.lg-ml .rule::before{left:-2px;border-left:0;border-right-color:#fff}
.lg-ml .rule::after{right:-2px;border-right:0;border-left-color:#fff}
.lg-t2c{display:inline-grid;justify-items:center;gap:.05em}
.lg-t2c .t{font-family:'Lemonada',cursive;font-weight:700;font-size:clamp(2rem,5.2vw,3.7rem);line-height:1.2;color:#fff;text-shadow:0 3px 0 #7fb2dd,0 12px 26px #0007}
.lg-t2c .sky{width:clamp(110px,15vw,170px);height:auto}
.lg-t2c .swash{width:62%;height:auto}
.lg-ps .stamp{display:inline-grid;place-items:center;padding:.6em .95em;aspect-ratio:1;border-radius:50%;border:.1em solid #f2c230;outline:.05em solid #f2c230;outline-offset:.2em;transform:rotate(-14deg);
  font-family:'Changa',sans-serif;font-weight:800;font-size:clamp(1.5rem,3.7vw,2.7rem);line-height:.95;color:#f2c230;text-align:center;filter:url(#stampf)}
.lg-ps .stamp span{display:block;transform:skewX(-8deg)}/* wide game screens */
.screens{display:grid;gap:clamp(34px,6vw,72px);padding-block:20px 20px}
.screen{position:relative;display:grid;align-items:end;min-height:420px;border-radius:22px;overflow:hidden;text-decoration:none;border:1px solid var(--line);isolation:isolate;background:var(--surface)}
.slides{position:absolute;inset:-9% 0;z-index:-2;will-change:transform}
.s{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:none}
.s.on{opacity:1;transform:scale(1);transition:opacity 1.3s ease,transform 9s linear}
.s.out{opacity:0;transform:scale(1);transition:opacity 1.3s ease}
.screen::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#0a0b0dd0 0%,#0a0b0d55 30%,transparent 58%),linear-gradient(270deg,#0a0b0db8 0%,#0a0b0d66 28%,transparent 54%)}
.screen{box-shadow:0 38px 90px -40px var(--glow,#000);transform:translateY(40px);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.screen.in{transform:none}
.screen h3,.screen .blurb{text-shadow:0 2px 18px #000b}
.screen .info{padding:28px;display:grid;gap:8px;max-width:640px;justify-self:start}
.screen h3{margin:0}
.screen .en{margin-top:.25em;direction:ltr;text-align:right;font-size:.9rem;color:#d0cddb;letter-spacing:.06em;text-transform:uppercase}
.screen .blurb{margin:0;color:#e4e1ec;max-width:56ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.84rem;color:#cfcbdb}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tag{font-size:.78rem;background:#ffffff16;border:1px solid #ffffff22;padding:2px 12px;border-radius:99px;backdrop-filter:blur(4px)}
.tag.gold{background:#f3b53f22;border-color:#f3b53f66;color:var(--gold)}
.screen.big{min-height:560px}
/* ===== Cinematic Game Portal: نص على اليمين فقط، واليسار مفتوح للرسمة ===== */
@property --wc{syntax:'<color>';inherits:true;initial-value:#00000000}
#wglow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 60% at 50% 45%,var(--wc),transparent 72%);opacity:.9;transition:--wc 1.4s ease}
.screen{--sc:1;--rim:#c9a35a;--vg:13,6,8;--gl:#e0952f66;scale:var(--sc);will-change:scale;display:grid;align-items:center;min-height:600px;border:1px solid var(--rim);border-radius:18px;background:#0a0b0d;
  box-shadow:0 0 0 1px #000,0 0 44px -8px var(--gl),0 34px 80px -34px var(--gl),inset 0 0 80px #000c,inset 0 1px 0 #ffffff24;transition:box-shadow .7s ease}
.screen:hover{box-shadow:0 0 0 1px #000,0 0 70px -4px var(--gl),0 40px 100px -30px var(--gl),inset 0 0 80px #000c,inset 0 1px 0 #ffffff38}

.screen::before{background:linear-gradient(270deg,rgba(var(--vg),.97) 0%,rgba(var(--vg),.92) 28%,rgba(var(--vg),.6) 42%,rgba(var(--vg),0) 56%)}
.screen .wf{display:block;position:absolute;inset:12px;pointer-events:none;z-index:1;border:1px solid color-mix(in srgb,var(--rim) 62%,transparent);border-radius:4px}
.screen .wf::before{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--rim) 26%,transparent);border-radius:2px}
.screen .wf .c{position:absolute;width:58px;height:58px;background:no-repeat center/contain;filter:drop-shadow(0 0 6px var(--gl))}
.screen .wf .c1{top:-3px;left:-3px}.screen .wf .c2{top:-3px;right:-3px;transform:scaleX(-1)}.screen .wf .c3{bottom:-3px;left:-3px;transform:scaleY(-1)}.screen .wf .c4{bottom:-3px;right:-3px;transform:scale(-1,-1)}
.w-st .wf .c{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2056%2056'%20fill%3D'none'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M2%2054V11L11%202H54'%20stroke%3D'%23d6a24b'%20stroke-width%3D'1.6'%2F%3E%3Cpath%20d%3D'M8%2054V16L16%208H54'%20stroke%3D'%23b3333f'%20stroke-width%3D'1'%2F%3E%3Cpath%20d%3D'M13%2013l4-4%204%204-4%204z'%20stroke%3D'%23d6a24b'%20stroke-width%3D'1.2'%2F%3E%3Cpath%20d%3D'M2%2011V2h9'%20stroke%3D'%23d6a24b'%20stroke-width%3D'2.4'%2F%3E%3C%2Fsvg%3E")}.w-ml .wf .c{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2056%2056'%20fill%3D'none'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M2%2054V14Q2%202%2014%202H54'%20stroke%3D'%23cfa95e'%20stroke-width%3D'1.6'%2F%3E%3Cpath%20d%3D'M8%2054V19Q8%208%2019%208H54'%20stroke%3D'%23a98640'%20stroke-width%3D'1'%2F%3E%3Cpath%20d%3D'M15%2015h11v7q0%206-5.5%209-5.5-3-5.5-9z'%20stroke%3D'%23cfa95e'%20stroke-width%3D'1.2'%2F%3E%3Ccircle%20cx%3D'21'%20cy%3D'20'%20r%3D'1.6'%20fill%3D'%23cfa95e'%20stroke%3D'none'%2F%3E%3C%2Fsvg%3E")}.w-t2c .wf .c{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2056%2056'%20fill%3D'none'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M2%2054V9Q2%202%209%202H54'%20stroke%3D'%23bfe3f0'%20stroke-width%3D'1.6'%2F%3E%3Cpath%20d%3D'M8%2054V15Q8%208%2015%208H54'%20stroke%3D'%23f3c969'%20stroke-width%3D'1'%2F%3E%3Cpath%20d%3D'M14%2022V16q0-2%202-2h6q2%200%202%202v6'%20stroke%3D'%23bfe3f0'%20stroke-width%3D'1.2'%2F%3E%3Cpath%20d%3D'M18%2022v-4'%20stroke%3D'%23f3c969'%20stroke-width%3D'1.2'%2F%3E%3C%2Fsvg%3E")}.w-ps .wf .c{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2056%2056'%20fill%3D'none'%20shape-rendering%3D'crispEdges'%3E%3Cpath%20d%3D'M2%2054V10H6V6H10V2H54'%20stroke%3D'%23d9704a'%20stroke-width%3D'2'%2F%3E%3Cpath%20d%3D'M8%2054V16H12V12H16V8H54'%20stroke%3D'%237e5a62'%20stroke-width%3D'1'%2F%3E%3C%2Fsvg%3E")}.w-pbz .wf .c{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2056%2056'%20fill%3D'none'%20stroke-linecap%3D'round'%3E%3Cpath%20d%3D'M2%2054V2H54'%20stroke%3D'%23cfc7b8'%20stroke-width%3D'1.4'%2F%3E%3Cpath%20d%3D'M8%2054V8H54'%20stroke%3D'%23b0382f'%20stroke-width%3D'1'%2F%3E%3Cpath%20d%3D'M2%2030L30%202'%20stroke%3D'%23b0382f'%20stroke-width%3D'1'%20opacity%3D'.6'%2F%3E%3C%2Fsvg%3E")}
.screen .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.screen .s{scale:1;transition:scale 1.8s cubic-bezier(.2,.7,.2,1)}
.screen .s.on{transition:opacity 1.3s ease,transform 9s linear,scale 1.8s cubic-bezier(.2,.7,.2,1)}
.screen .s.out{transition:opacity 1.3s ease,scale 1.8s cubic-bezier(.2,.7,.2,1)}
.screen:hover .s{scale:1.04}
.screen .info{position:relative;z-index:2;width:min(420px,40%);max-width:420px;box-sizing:content-box;justify-self:start;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:60px 56px 60px 24px;gap:12px}
.screen .pn{display:contents}
.screen .blurb{color:#fff;font-size:1.04rem;line-height:1.85;max-width:none;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.screen .en{justify-self:start;color:#e7e1d6;text-align:left}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-top:6px}
.act .bd{display:grid;gap:6px}
.wbtn{display:inline-flex;align-items:center;font-weight:700;font-size:1.05rem;cursor:pointer;line-height:1.2;padding:13px 32px;border-radius:999px;color:#fff;border:1px solid var(--rim);
  background:linear-gradient(180deg,#ffffff24,#ffffff0a);backdrop-filter:blur(8px);box-shadow:0 0 22px -4px var(--gl),inset 0 1px 0 #ffffff40;transition:transform .25s,box-shadow .25s,background .25s}
.screen:hover .wbtn{transform:translateY(-2px);background:linear-gradient(180deg,#ffffff38,#ffffff14);box-shadow:0 0 32px -2px var(--gl),inset 0 1px 0 #ffffff55}
.w-st{--rim:#c8923f;--vg:13,6,8;--gl:#e0502e70}
.w-ml{--rim:#c9a35a;--vg:15,11,7;--gl:#e8982f70}
.w-t2c{--rim:#bfe3f0;--vg:8,18,34;--gl:#7fc8e870}
.w-t2c{box-shadow:0 0 0 1px #000,0 0 44px -8px #7fc8e870,0 0 90px -24px #f3b53f66,0 34px 80px -34px #7fc8e870,inset 0 0 80px #000c,inset 0 1px 0 #ffffff30}
.w-ps{--rim:#d9704a;--vg:25,17,22;--gl:#e0764d66}
.w-pbz{--rim:#cfc7b8;--vg:10,11,13;--gl:#b0382f70}
@media (max-width:760px){
  .screen .wf{inset:8px}.screen .wf .c{width:38px;height:38px}
  .screen{min-height:620px;align-items:end}
  .screen::before{background:linear-gradient(0deg,rgba(var(--vg),.95) 0%,rgba(var(--vg),.85) 46%,rgba(var(--vg),0) 78%)}
  .screen .info{width:100%;max-width:none;box-sizing:border-box;padding:32px 26px 34px}
}
@media (prefers-reduced-motion:reduce){.screen{scale:1!important}.screen .s{transition:none}}
/* ===== صفحات الألعاب: هيكل موحد (هيرو طويل، لوحات بعناوينها في مكانها) + طابع كل لعبة ===== */
body[data-world]{background:var(--w-bg);color:var(--w-ink)}
body[data-world]::before{background:var(--w-nav-bg)}
body[data-world] #wglow{display:none}
body[data-world] nav.top{background:var(--w-nav-bg);border-bottom:var(--w-nav-bd);backdrop-filter:none}
body[data-world] .logo span{color:var(--w-mute)}

/* reel */
.reelwrap{padding-block:60px 0}
.reel{position:relative;aspect-ratio:21/9;min-height:300px;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);isolation:isolate}
.reel .r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:none}
.reel .r.on{opacity:1;transform:scale(1);transition:opacity 1s ease,transform 6.5s linear}
.reel .r.out{opacity:0;transform:scale(1);transition:opacity 1s ease}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0a0b0de6 0%,transparent 45%);pointer-events:none}
.rcap{position:absolute;z-index:2;inset-inline-start:22px;bottom:20px;display:flex;align-items:baseline;gap:12px;text-decoration:none}
.rcap b{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.4rem);font-weight:700;line-height:1.2;text-shadow:0 2px 20px #000}
.rcap small{color:var(--gold);font-size:.85rem}
.rprog{position:absolute;z-index:2;inset:auto 0 0 0;height:3px;background:#ffffff14}
.rprog i{display:block;height:100%;background:var(--gold);transform-origin:right;transform:scaleX(0)}
.rprog i.go{animation:prog 4.6s linear both}
@keyframes prog{to{transform:scaleX(1)}}

.req{margin-top:60px;border:1px solid #f3b53f44;border-radius:22px;padding:34px;background:linear-gradient(135deg,#f3b53f1c,transparent 60%);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}

/* 3) الكوكبة: خريطة فلكية بإسطرلاب */
.const .cwrap{padding:0;background:radial-gradient(90% 80% at 62% 30%,#16161c 0%,#0c0d10 72%)}
.cstage{position:relative}
.astro{position:absolute;top:50%;width:min(132%,1260px);aspect-ratio:1;pointer-events:none;opacity:.2;will-change:transform}
.astro.o{left:58%;translate:-50% -50%;animation:spin 320s linear infinite}
.astro.r{left:58%;width:min(96%,900px);translate:-50% -50%;animation:spin 210s linear infinite reverse;opacity:.15}
.astro *{vector-effect:non-scaling-stroke}
.astro .k{fill:none;stroke:#f3b53f;stroke-width:.8}.astro .k2{fill:none;stroke:#f3b53f;stroke-width:.5;stroke-dasharray:2 5}
.astro text{fill:#f3b53f;font-family:var(--body);font-size:11px;text-anchor:middle}
@keyframes spin{to{rotate:360deg}}
.csvg{overflow:visible}
.cl{stroke-width:1;stroke-opacity:.42}
.cl.an{stroke:#9fcbe3;stroke-opacity:.34}.cl.br{stroke:#e9e2d0;stroke-opacity:.16;stroke-dasharray:1}
.cs .halo{transform-box:fill-box;transform-origin:center;opacity:.75;transition:opacity .4s}
.cs.pulse .halo{animation:pulse 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.6}50%{transform:scale(1.14);opacity:1}}
.cs:hover .halo,.cs:focus-visible .halo{opacity:1}
.cs .sp{fill:#f6cf7a}.cs.an .sp{fill:#d6ecf7}

.ctip{position:absolute;z-index:3;pointer-events:none;min-width:190px;max-width:250px;padding:12px 16px 13px;border-radius:14px;background:#16141299;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #f3b53f38;box-shadow:0 16px 40px -14px #000;
  opacity:0;transform:translate(-50%,calc(-100% - 18px)) translateY(6px);transition:opacity .25s,transform .25s}
.ctip.on{opacity:1;transform:translate(-50%,calc(-100% - 18px))}
.ctip.dn{transform:translate(-50%,18px) translateY(-6px)}.ctip.dn.on{transform:translate(-50%,18px)}
.cs:hover .sg,.cs:focus-visible .sg{transform:scale(calc(var(--sc,1)*1.3))}
.ctip.an{border-color:#9fcbe345}
.ctip b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.3;color:#f6ecd6}
.ctip span{display:block;font-size:.82rem;color:#cfc9bb}.ctip span i{font-style:normal;color:var(--gold)}.ctip.an span i{color:#a9d6ec}
.ctip small{display:block;margin-top:6px;font-size:.74rem;color:var(--mute)}
.clegend{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;padding:4px 16px 16px;font-size:.8rem;color:var(--mute);position:relative}
.clegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:7px;vertical-align:middle;background:#f3b53f;box-shadow:0 0 10px #f3b53f}

@media (max-width:760px){.csvg text{display:none}.cs .sg{transform:scale(calc(var(--sc,1)*1.9))}.cs:hover .sg{transform:scale(calc(var(--sc,1)*2.1))}.cs .halo{scale:1.6}.cl{stroke-width:1.6}.ctip{display:none}.astro.o{width:190%}.astro.r{width:140%}}

/* 4) مختبر «قبل وبعد» في «من داخل عوالمنا» */
.lab{padding-block:70px 0;scroll-margin-top:80px}
.labtabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.labtabs button{font:inherit;font-size:.86rem;color:#d8d2c4;background:#ffffff07;border:1px solid #ffffff1a;border-radius:999px;padding:6px 15px;cursor:pointer;transition:color .3s,border-color .3s,background .3s}
.labtabs button:hover{color:#fff;border-color:#f3b53f66}
.labtabs button.on{color:var(--gold);border-color:#f3b53f99;background:#f3b53f14}
.labstage{position:relative;border-radius:22px;overflow:hidden;border:1px solid #ffffff14;box-shadow:0 30px 70px -36px #000;background:#000}
.labstage .bacard{border:0;border-radius:0}
.labstage .bacard img{transition:opacity .45s ease}
.labstage .bacard.fade img{opacity:.15}
.labbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:linear-gradient(#111114,#0d0d10);border-top:1px solid #ffffff10}
.labname{display:flex;align-items:baseline;gap:10px;text-decoration:none;min-width:0}

.labname small{color:var(--gold);font-size:.82rem;white-space:nowrap}
.labname:hover b{color:var(--gold)}
.labnav{display:flex;align-items:center;gap:10px;flex-shrink:0}
.labnav span{color:var(--mute);font-size:.84rem;font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center}
.rbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff26;background:#ffffff0a;color:#e8e2d4;cursor:pointer;transition:border-color .3s,background .3s,color .3s;padding:0}
.rbtn:hover{border-color:#f3b53f99;color:var(--gold);background:#f3b53f12}
.rbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.labstage .rprog{position:static;height:2px}
.labstage .rprog i{transform-origin:right}
.labstage .rprog i.go{animation:prog var(--dur,9s) linear both}
.labstage .rprog i.hold{animation-play-state:paused}
.lab .bacap{margin-top:10px}

/* 5) Bento */
.bento{padding-block:80px 0;scroll-margin-top:80px}
.bgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bt{position:relative;isolation:isolate;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#131317,#0f0f12);border:1px solid #ffffff12;box-shadow:inset 0 1px 0 #ffffff0d,0 24px 60px -40px #000;padding:24px 26px}
.bt .kk{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--gold);font-size:.86rem;font-weight:500}
.bt .kk::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#f3b53f00,#f3b53f55)}
.t-nums{grid-column:span 12;padding-block:22px 18px}
.t-nums .nums{grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.t-nums .num{border:0;padding:6px 22px;border-inline-start:1px solid #ffffff12}
.t-nums .num:first-child{border-inline-start:0;padding-inline-start:4px}
.t-nums .nnote{margin-top:14px}
.t-log{grid-column:span 7;grid-row:span 2}
.t-hl{grid-column:span 5;padding:0;display:grid;min-height:220px}
.t-hl .hl{border:0;border-radius:0;min-height:0;height:100%}
.t-hl .hl img{opacity:.55;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .6s}
.t-hl .hl:hover{transform:none}.t-hl .hl:hover img{transform:scale(1.05);opacity:.7}
.t-poem{grid-column:span 8;text-align:center;padding:34px 26px 28px}
.t-req{grid-column:span 4;display:flex;flex-direction:column;justify-content:center;gap:10px;background:radial-gradient(120% 120% at 100% 0%,#f3b53f14,transparent 60%),linear-gradient(180deg,#131317,#0f0f12)}
.t-req h3{font-family:var(--display);font-size:2rem;margin:0;line-height:1.3}.t-req p{margin:0;color:var(--mute)}.t-req .pill{align-self:flex-start;margin-top:6px}
/* السجل */
.blog{list-style:none;margin:0;padding:0;display:grid}
.blog li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 4px;border-top:1px solid #ffffff0c}
.blog li:first-child{border-top:0}
.blog .bdg{font-size:.72rem;font-weight:600;padding:3px 11px;border-radius:99px;white-space:nowrap}
.bdg.add{background:#2f8a6420;color:#8fd3b0;border:1px solid #4aa57e55}
.bdg.upd{background:#f3b53f1a;color:var(--gold);border:1px solid #f3b53f55}
.blog a{text-decoration:none;font-weight:600;color:#f1ece2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blog a:hover{color:var(--gold)}
.blog time{color:var(--mute);font-size:.78rem;white-space:nowrap}
.blog .n{grid-column:2/4;color:#b9b5c6;font-size:.86rem;line-height:1.6}
.blogmore{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.2,.7,.2,1)}
.blogmore>div{overflow:hidden;min-height:0}
.blogmore.open{grid-template-rows:1fr}
.blogmore .blog li:first-child{border-top:1px solid #ffffff0c}
.lmore{font:inherit;font-size:.88rem;margin-top:14px;color:#e8e2d4;background:#ffffff08;border:1px solid #ffffff22;border-radius:999px;padding:8px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .3s,color .3s}
.lmore:hover{border-color:#f3b53f99;color:var(--gold)}
.lmore svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .4s}.lmore.open svg{transform:rotate(180deg)}
/* حبر اليوم */
.t-poem .wm{position:absolute;inset:0;z-index:-1;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.t-poem .wm b{font-family:var(--display);font-size:clamp(9rem,22vw,17rem);line-height:1;color:#f3b53f;opacity:.05;transform:rotate(-8deg) translateY(4%);white-space:nowrap}
.t-poem .wm svg{position:absolute;width:300px;height:300px;inset-inline-start:-80px;top:-90px;opacity:.07;fill:none;stroke:#f3b53f;stroke-width:1}
.t-poem .wm svg.b{inset-inline-start:auto;inset-inline-end:-90px;top:auto;bottom:-110px}
.t-poem .pq{min-height:clamp(150px,18vw,200px);margin-top:10px;font-size:clamp(1.55rem,3.3vw,2.55rem);max-width:min(760px,96%)}
.t-poem .pctl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}
.t-poem .pdots{margin:0}
.t-poem .pdots i{cursor:pointer;width:7px;height:7px}
/* الشريط الأخير: ركن الراحة */
.tea3 .wisp{fill:none;stroke:#f4ecd8;stroke-width:6;stroke-linecap:round;opacity:0;filter:url(#wblur);transform-box:fill-box;transform-origin:50% 100%;animation:wisp 3.4s ease-in-out infinite}
.tea3 .wisp:nth-of-type(2){animation-delay:-1.1s;animation-duration:3.9s}.tea3 .wisp:nth-of-type(3){animation-delay:-2.3s;animation-duration:3.1s}
@keyframes wisp{0%{opacity:0;transform:translateY(10px) scaleX(.7)}25%{opacity:.5}65%{opacity:.28;transform:translateY(-14px) scaleX(1.2) skewX(10deg)}100%{opacity:0;transform:translateY(-30px) scaleX(.85) skewX(-8deg)}}
#steamg{transition:opacity 1.2s ease}
.tea3 .pot{cursor:pointer}
.tea3 .hint{color:#e7dcc6;font-family:var(--display);font-size:1.15rem;margin:0}
.jo .viz{position:absolute;z-index:2;inset-inline-end:16px;bottom:16px;display:flex;align-items:flex-end;gap:3px;height:42px;padding:8px 10px;border-radius:12px;background:#05080c99;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid #1d5a7888}
.jo .viz i{display:block;width:3px;height:100%;border-radius:2px;background:linear-gradient(#bfeaff,#1aa9ff);box-shadow:0 0 8px #1aa9ff88;transform-origin:50% 100%;transform:scaleY(.2);animation:eq var(--t,1.2s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes eq{0%{transform:scaleY(.14)}50%{transform:scaleY(var(--h,.7))}100%{transform:scaleY(.3)}}
.jo figcaption{padding-inline-end:150px}
/* 7) سيلفر باينز (Silver Pines، الاسم منقحر بطلب أبو حميد مثل شعار الحزمة): شعار شريطين أحمرين ممزقين على طراز شعار حزمة التعريب، وصفحة رعب داكنة (تقريب) */
.lg-sp{display:inline-grid;grid-template-columns:1fr;gap:.16em;line-height:1;padding-bottom:.08em}

@media (min-width:761px){.w-sp .logo-h{zoom:1}}
body[data-world="sp"]{--w-bg:#0b0a0a;--w-ink:#ece4dc;--w-mute:#b3a69e;--w-nav-bg:#0b0a0a;--w-nav-bd:2px solid #9e1010;--w-vg:11,9,9;--w-r:2px;--w-panel:#141112;--w-panel-bd:1px solid #3d1717;--w-panel-sh:0 14px 30px -14px #000;--w-title-bg:#9e1010;--w-title-fg:#f6ece6;--w-accent:#d4231d;--w-btn:#c0140f;--w-btn-fg:#fff6f2;--w-btn-bd:1px solid #ff5a4a66;--w-btn-r:2px;--w-shot-bd:1px solid #3d1717}
/* 8) إنسكريبشن (Inscryption): الشعار العربي الأصلي من حزمة التعريب (logo_banner.png 280×84 بكسل آرت) مكبّراً بلا تغبيش، وصفحة كوخ خشبي وشموع (تقريب) */
.lg-insc{display:block;line-height:0}.lg-insc img{display:block;height:clamp(78px,10vw,126px);width:auto;max-width:100%;image-rendering:pixelated;filter:drop-shadow(0 4px 14px #000a)}
.w-insc{--vg:20,12,8;--gl:#d9762b70}
@media (min-width:761px){.w-insc .logo-h{zoom:1}}
body[data-world="insc"]{--w-bg:#100b08;--w-ink:#ebe2cf;--w-mute:#b8a68a;--w-nav-bg:#0c0806;--w-nav-bd:2px solid #6b4224;--w-vg:16,11,8;--w-r:2px;--w-panel:#1b130d;--w-panel-bd:1px solid #5a3a22;--w-panel-sh:0 14px 30px -14px #000;--w-title-bg:#2b1c12;--w-title-fg:#dfe2ad;--w-accent:#d9762b;--w-btn:#d9762b;--w-btn-fg:#160d07;--w-btn-bd:1px solid #f0a060;--w-btn-r:2px;--w-shot-bd:1px solid #5a3a22}
/* 6) v5: الكوكبة على مرحلتين: بوابة القمر والأرض ← خريطة نجوم عريضة تُسحب. نسخة الرجوع index.v54-backup.html */
.cwrap.portal{position:relative;aspect-ratio:16/9;padding:0;background:#050608;border-color:#1d1f25;
  --ex:51.31%;--ey:-8.44%;--erx:37.53%;--ery:72.57%;--tx:51.31%;--ty:30%}
/* صورة البوابة العريضة moon-portal-2.jpg (421×237، اختيار أبو حميد) والقديمة moon-portal.jpg (1200×675) باقية للرجوع بقيمها: --ex:51%;--ey:-5.93%;--erx:38.5%;--ery:71.85%;--tx:51%;--ty:34% */
.moon{position:absolute;inset:0;transform-origin:var(--tx) var(--ty);transition:transform 1.25s cubic-bezier(.65,0,.3,1),opacity 1s ease,filter 1.2s ease;
  -webkit-mask-image:radial-gradient(ellipse 72% 92% at 50% 42%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 92% at 50% 42%,#000 58%,transparent 100%)}
.moon picture,.moon img{position:absolute;inset:0;width:100%;height:100%;display:block}
.moon img{object-fit:cover;user-select:none;-webkit-user-drag:none}
.moon .eclip{clip-path:ellipse(var(--erx) var(--ery) at var(--ex) var(--ey));transform-origin:var(--ex) var(--ey);transition:transform 1.1s cubic-bezier(.2,.7,.2,1),filter .9s ease;pointer-events:none}
.earth{position:absolute;z-index:2;left:calc(var(--ex) - var(--erx));top:calc(var(--ey) - var(--ery));width:calc(2 * var(--erx));height:calc(2 * var(--ery));border-radius:50%;border:0;padding:0;margin:0;background:none;cursor:pointer;
  box-shadow:0 0 34px 4px #7fc8ff26,0 0 90px 10px #7fc8ff12;animation:ehalo 5.5s ease-in-out infinite;transition:box-shadow .8s}
.earth:focus-visible{outline:2px solid #bfe3f7;outline-offset:4px}
@keyframes ehalo{0%,100%{box-shadow:0 0 30px 2px #7fc8ff1f,0 0 80px 8px #7fc8ff0f}50%{box-shadow:0 0 46px 8px #8fd0ff3d,0 0 120px 20px #7fc8ff1c}}
.earth:hover,.earth:focus-visible{animation:none;box-shadow:0 0 60px 12px #9fd8ff55,0 0 150px 30px #7fc8ff2a}
.moon:has(.earth:hover) .eclip,.moon:has(.earth:focus-visible) .eclip{transform:scale(1.03);filter:brightness(1.14) saturate(1.08)}
.etext{position:absolute;z-index:3;left:var(--tx);top:var(--ty);transform:translate(-50%,-50%) translateY(8px);pointer-events:none;white-space:nowrap;
  font-family:var(--body);font-weight:500;font-size:clamp(1rem,1.9vw,1.3rem);line-height:1.4;color:#fff6e4;letter-spacing:0;padding:.5em 1.3em .55em;border-radius:999px;
  background:#0a0b0d55;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #ffffff2a;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
.moon:has(.earth:hover) .etext,.moon:has(.earth:focus-visible) .etext{opacity:1;transform:translate(-50%,-50%)}
@media (hover:none){.etext{opacity:.92;transform:translate(-50%,-50%);animation:tfloat 4s ease-in-out infinite}}
@keyframes tfloat{50%{transform:translate(-50%,-50%) translateY(-5px)}}
.mcred{margin:10px 4px 0;font-size:.78rem;color:var(--mute)}
.cflash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--tx) var(--ty),#eaf6ffcc,#9fd3f522 30%,transparent 62%)}
.cflash.go{animation:flash 1.3s ease both}
@keyframes flash{0%{opacity:0}45%{opacity:.9}100%{opacity:0}}
.orbit{position:absolute;inset:0;z-index:4;display:grid;grid-template-rows:minmax(0,1fr) auto;opacity:0;transform:scale(.78);filter:blur(8px);pointer-events:none;
  background:radial-gradient(90% 80% at 62% 30%,#16161c 0%,#0c0d10 72%);transition:opacity .7s ease,transform .9s cubic-bezier(.4,0,.6,1),filter .7s ease}
.cwrap.in-orbit .orbit{opacity:1;transform:none;filter:none;pointer-events:auto;transition:opacity .9s ease .5s,transform 1.3s cubic-bezier(.2,.7,.2,1) .35s,filter 1s ease .45s}
.cwrap.in-orbit .moon{transform:scale(3.2);opacity:0;filter:blur(10px);pointer-events:none;transition:transform 1.25s cubic-bezier(.65,0,.3,1),opacity .9s ease .3s,filter 1s ease .2s}
.cwrap:not(.in-orbit) .moon{transition-delay:.25s,.25s,.25s}
.ostage{position:relative;overflow:hidden;direction:ltr;cursor:grab;touch-action:pan-y;user-select:none}

.sect{position:absolute;z-index:4;bottom:16px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.86rem;color:#e8e2d4;direction:rtl;
  padding:8px 16px;border-radius:999px;background:#12110f99;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff22;cursor:pointer;transition:border-color .3s,color .3s,opacity .4s}
.sect svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sect.ah{right:16px;border-color:#f3b53f55}.sect.ah:hover{color:var(--gold);border-color:#f3b53faa}

    '<figcaption class="bacap"><b>معاينة تركيب:</b> النص العربي مأخوذ حرفياً من ملف تعريب '+esc(g.ar)+' ('+esc(b.ref)+') ومركّب على اللقطة الأصلية، فقد يختلف الإطار والتفاف الأسطر شيئاً يسيراً عمّا يظهر داخل اللعبة. '+(b.note?esc(b.note):'')+'</figcaption></figure>'}).join('')+'</div></section>';

/* أول لعبتين عريضتين كبار، والباقي أزواج، وإن بقيت لعبة وحدها تأخذ العرض كامل */

var FILTERS=[['all','الكل'],['ah','تعريب أبو حميد'],['an','تعريب أبو النوفي'],['guest','تعديلات الخطوط']];

function fadeTo(el,show){
  if(!el)return;el._want=show;
  if(show&&el.hidden){el.hidden=false;if(el.animate)el.animate([{opacity:0,translate:'0 18px'},{opacity:1,translate:'0 0'}],{duration:480,easing:'cubic-bezier(.2,.7,.2,1)'})}
  else if(!show&&!el.hidden){if(!el.animate){el.hidden=true;return}var a=el.animate([{opacity:1,translate:'0 0'},{opacity:0,translate:'0 14px'}],{duration:260,easing:'ease-in',fill:'forwards'});a.onfinish=function(){if(el._want===false)el.hidden=true;a.cancel()}}
}
function initFilters(){

    document.querySelectorAll('#all .screen').forEach(function(c){fadeTo(c,f==='all'||c.dataset.by===f)});

function guestsHTML(){

/* «من داخل عوالمنا» صار مختبر «قبل وبعد»: كل أزواج ba من كل الألعاب، بالتناوب بين الألعاب بلا تكرار متتالي */
var LAB=[],labI=0,labT=null,labRaf=0,labTouch=0,labVis=false,LABDUR=9000;
function labPairs(){
  var G=GAMES.filter(function(g){return g.ba&&g.ba.length}),p=[],mx=Math.max.apply(null,G.map(function(g){return g.ba.length}).concat([0]));
  for(var k=0;k<mx;k++)G.forEach(function(g){if(g.ba[k])p.push({g:g,b:g.ba[k]})});return p;
}
var CHEV_R='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',CHEV_L='<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
function labHTML(){
  LAB=labPairs();if(!LAB.length)return '';
  var G=[];LAB.forEach(function(x){if(G.indexOf(x.g)<0)G.push(x.g)});
  return '<section class="lab hd" id="lab"><h2 class="sec">من داخل عوالمنا</h2><p class="sub">مختبر «قبل وبعد»: اسحب المقبض، يسار اللعبة بالإنجليزي الأصلي، ويمين نفس الشاشة بتعريبنا.</p>'+
   '<div class="labtabs" role="group" aria-label="اختر اللعبة">'+G.map(function(g){return '<button type="button" data-id="'+g.id+'">'+esc(g.ar)+'</button>'}).join('')+'</div>'+
   '<div class="labstage"><div class="bacard" id="labcard" tabindex="0" role="slider" aria-label="مقارنة الإنجليزي بالعربي" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><img id="laben" alt="الشاشة بالإنجليزي الأصلي" draggable="false"><img class="ar" id="labar" alt="نفس الشاشة بالتعريب" draggable="false"><span class="chip l">English</span><span class="chip r">عربي</span><i class="h"></i></div>'+
   '<div class="labbar"><a class="labname" id="labname" href="#"></a><div class="labnav"><button type="button" class="rbtn" id="labprev" aria-label="السابق">'+CHEV_R+'</button><span id="labcount"></span><button type="button" class="rbtn" id="labnext" aria-label="التالي">'+CHEV_L+'</button></div></div>'+
   '<div class="rprog"><i id="labprog"></i></div></div>'+
   '<p class="bacap" id="labcap"></p></section>';
}
function bindBA(c,onUser){
  function set(p){p=Math.max(0,Math.min(100,p));c.style.setProperty('--p',p+'%');c.setAttribute('aria-valuenow',Math.round(p))}
  function fromX(x){var r=c.getBoundingClientRect();set((x-r.left)/r.width*100)}
  var down=false;c._set=set;
  c.addEventListener('pointerdown',function(e){down=true;if(onUser)onUser();try{c.setPointerCapture(e.pointerId)}catch(_){}fromX(e.clientX)});
  c.addEventListener('pointermove',function(e){if(down)fromX(e.clientX)});
  c.addEventListener('pointerup',function(){down=false});c.addEventListener('pointercancel',function(){down=false});
  c.addEventListener('keydown',function(e){var p=parseFloat(getComputedStyle(c).getPropertyValue('--p'))||50;if(e.key==='ArrowLeft'){if(onUser)onUser();set(p-5);e.preventDefault()}else if(e.key==='ArrowRight'){if(onUser)onUser();set(p+5);e.preventDefault()}});
}
/* الحبر ينتشر من اليمين: المقبض يبدأ يساراً (أغلب الشاشة إنجليزي) ثم يكشف العربي ويستقر في الوسط */
function labSweep(c){
  cancelAnimationFrame(labRaf);var t0=0,D=2600;
  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
  (function f(t){if(!t0)t0=t;var u=Math.min(1,(t-t0)/D),p;
    if(u<.62)p=90-ease(u/.62)*78;else p=12+ease((u-.62)/.38)*38;
    c._set(p);if(u<1)labRaf=requestAnimationFrame(f)})(performance.now());
}
function labGo(i,user){
  if(!LAB.length)return;labI=(i+LAB.length)%LAB.length;var it=LAB[labI],c=document.getElementById('labcard');if(!c)return;
  if(user)labTouch=Date.now();
  var a=new Image(),b=new Image(),n=0;c.classList.add('fade');
  function done(){if(++n<2)return;
    document.getElementById('laben').src=it.b.en;document.getElementById('labar').src=it.b.ar;c.classList.remove('fade');
    var nm=document.getElementById('labname');nm.href='#'+it.g.id;nm.innerHTML='<b>'+esc(it.g.ar)+'</b><small>افتح صفحتها</small>';
    document.getElementById('labcount').textContent=(labI+1).toLocaleString('ar-EG')+' / '+LAB.length.toLocaleString('ar-EG');
    document.getElementById('labcap').innerHTML='<b>معاينة تركيب:</b> النص العربي مأخوذ حرفياً من ملف تعريب '+esc(it.g.ar)+' ومركّب على اللقطة الأصلية، فقد يختلف الإطار شيئاً يسيراً عمّا داخل اللعبة. المصدر والتفاصيل في صفحة اللعبة.';
    document.querySelectorAll('.labtabs button').forEach(function(x){x.classList.toggle('on',x.dataset.id===it.g.id)});
    if(Date.now()-labTouch>1200)labSweep(c);else{cancelAnimationFrame(labRaf);c._set(50)}
    labArm();
    var nx=LAB[(labI+1)%LAB.length];new Image().src=nx.b.en;new Image().src=nx.b.ar;
  }
  a.onload=a.onerror=done;b.onload=b.onerror=done;a.src=it.b.en;b.src=it.b.ar;
}
function labArm(){
  clearTimeout(labT);var bar=document.getElementById('labprog');if(!bar)return;
  bar.className='';void bar.offsetWidth;
  if(!labVis)return;
  var wait=Math.max(LABDUR,15000-(Date.now()-labTouch));bar.style.setProperty('--dur',wait+'ms');bar.className='go';
  labT=setTimeout(function(){labGo(labI+1)},wait);
}
function initLab(){
  var c=document.getElementById('labcard');if(!c)return;
  bindBA(c,function(){labTouch=Date.now();cancelAnimationFrame(labRaf);labArm()});
  document.getElementById('labprev').onclick=function(){labGo(labI-1,1)};
  document.getElementById('labnext').onclick=function(){labGo(labI+1,1)};
  document.querySelector('.labtabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;for(var i=0;i<LAB.length;i++)if(LAB[i].g.id===b.dataset.id){labGo(i,1);break}});
  labI=0;labTouch=0;labGo(0);
  if('IntersectionObserver' in window){obsLab=new IntersectionObserver(function(es){var v=es[0].isIntersecting;if(v&&!labVis){labVis=true;labTouch=Math.min(labTouch,Date.now()-20000);labSweep(c);labArm()}else if(!v){labVis=false;clearTimeout(labT);var bar=document.getElementById('labprog');if(bar)bar.className=''}},{threshold:.35});obsLab.observe(c)}
  else{labVis=true;labArm()}
}
var obsLab=null;
function home(){document.body.removeAttribute('data-world');

  app.innerHTML=
   '<section class="hero bleed"><div class="rows" aria-hidden="true">'+rows+'</div>'+
   '<div class="copy wrap">'+
   '<h1>ألعابك <em>انكتبت</em><br>بحبر عربي</h1>'+
   '<p>تعريبات صنعناها بأيدينا لألعاب نحبها، نصوص وواجهات وخطوط على ذوقنا.</p>'+
   '<div class="cta"><a class="pill" href="#all">تصفّح التعريبات</a><span class="tea">'+cup+'صبّ لك شاهي، واختر تعريبك</span></div>'+
   '<div class="stats"><div class="stat"><strong>'+GAMES.filter(function(g){return !g.guest}).length+'</strong><span>لعبة معرّبة</span></div><div class="stat"><strong style="direction:ltr">'+last+'</strong><span>آخر تحديث</span></div></div>'+
   '</div><a class="down" href="#all" aria-label="انزل لتشوف التعريبات"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></a></section>'+
   '<div class="wrap"><div class="screens" id="all" style="scroll-margin-top:80px"><div class="hd"><h2 class="sec">كل التعريبات</h2><p class="sub">اضغط على أي لعبة لتفتح صفحتها وتحمّل التعريب.</p></div>'+filtersHTML()+screensHTML()+'</div>'+guestsHTML()+

/* كبسولة التنقل: الضغط ينزل للقسم بنعومة، والمؤشر يتبع القسم الظاهر */
var SECS=['all','lab','const','bento','cozy'],spyOn=false,spyTick=false;
function spy(){
  var cap=document.getElementById('navcap');if(!cap)return;
  if(document.body.dataset.world){cap.classList.remove('has','show');return}
  var vh=innerHeight,cur=null;
  SECS.forEach(function(id){var el=document.getElementById(id);if(!el)return;var r=el.getBoundingClientRect();if(r.top<vh*.42&&r.bottom>vh*.2)cur=id});
  if(!cur){var m=document.getElementById('mods');if(m&&!m.hidden){var rm=m.getBoundingClientRect();if(rm.top<vh*.42&&rm.bottom>vh*.2)cur='all'}}
  cap.classList.toggle('show',scrollY>vh*.55);
  var ind=cap.querySelector('.ind');
  cap.querySelectorAll('a').forEach(function(a){var on=a.dataset.s===cur;a.classList.toggle('on',on);if(on){ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'}});
  cap.classList.toggle('has',!!cur);
}
function initSpy(){
  if(!spyOn){spyOn=true;
    window.addEventListener('scroll',function(){if(spyTick)return;spyTick=true;requestAnimationFrame(function(){spyTick=false;spy()})},{passive:true});
